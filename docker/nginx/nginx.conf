server {
    listen 80;
    server_name mskinwellness.local www.mskinwellness.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mskinwellness.local www.mskinwellness.local;

    ssl_certificate     /etc/nginx/ssl/mskinwellness.crt;
    ssl_certificate_key /etc/nginx/ssl/mskinwellness.key;

    client_max_body_size 6M;

    # raiz = build estatico de Angular; las rutas no encontradas caen al SPA
    root /var/www/dist;
    index index.html;

    # rutas servidas por Laravel (php-fpm): api, panel Blade /admin, webhook /stripe, healthcheck /up, assets Vite /build
    location ~ ^/(api|admin|stripe|up|build)(/|$) {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;          # un solo nginx+fastcgi: Laravel ve https directo (sin TrustProxies)
    }

    location / {
        try_files $uri $uri/ /index.html;   # deep-links del SPA Angular
    }
}
