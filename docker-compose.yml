services:
  postgres:
    image: postgres:16
    container_name: mskin_postgres
    environment:
      POSTGRES_DB: mskin_wellness
      POSTGRES_USER: mskin_user
      POSTGRES_PASSWORD: mskin_pass
      TZ: Europe/Madrid
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      mskin_net:
        ipv4_address: 10.1.0.52

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mskin_php
    working_dir: /var/www/html
    environment:
      TZ: Europe/Madrid
    volumes:
      - ./M_Skin_Welness_BE:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zzz-custom.ini
    depends_on:
      - postgres
    networks:
      mskin_net:
        ipv4_address: 10.1.0.51

  nginx:
    image: nginx:alpine
    container_name: mskin_nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: Europe/Madrid
    volumes:
      - ./M_Skin_Welness_BE:/var/www/html
      - ./M_Skin_Welness_FE/dist/M_Skin_Welness_FE/browser:/var/www/dist:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - php
    networks:
      mskin_net:
        ipv4_address: 10.1.0.50

  dns:
    image: internetsystemsconsortium/bind9:9.18
    container_name: mskin_bind9
    volumes:
      - ./docker/bind9:/etc/bind
    networks:
      mskin_net:
        ipv4_address: 10.1.0.53

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: mskin_stripe_cli
    command: listen --forward-to https://nginx/stripe/webhook --skip-verify
    environment:
      STRIPE_API_KEY: sk_test_xxx
    depends_on:
      - nginx
    networks:
      mskin_net:
        ipv4_address: 10.1.0.54

volumes:
  pgdata:

networks:
  mskin_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.0.0/24
