@if (loadingMessage(); as message) {
  <app-loading-overlay [message]="message" />
}

@if (auth.isImpersonating()) {
  <div class="flex items-center justify-between gap-3 bg-warning-50 border-b border-warning-200 px-4 py-2 text-sm text-warning-700">
    <span>
      Estás dentro como administrador de <strong>{{ impersonationCenterName() }}</strong>.
    </span>
    <button
      type="button"
      (click)="exitImpersonation()"
      class="rounded-md border border-warning-300 bg-white px-3 py-1 text-xs font-semibold text-warning-700 transition hover:bg-warning-100"
    >
      Salir del centro
    </button>
  </div>
}

<header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-gray-200 bg-white px-4 lg:px-6">
  <button
    type="button"
    (click)="toggleSidebar()"
    aria-label="Abrir o cerrar menú"
    class="flex h-10 w-10 items-center justify-center rounded-lg border border-gray-200 text-gray-600 transition hover:bg-gray-50"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <div class="relative">
    <button
      type="button"
      (click)="toggleDropdown($event)"
      class="flex items-center gap-3 rounded-lg px-2 py-1.5 transition hover:bg-gray-50"
      aria-haspopup="menu"
      [attr.aria-expanded]="dropdownOpen()"
    >
      <span class="flex h-10 w-10 items-center justify-center overflow-hidden rounded-full bg-brand-50 text-brand-500">
        @if (auth.user()?.avatar_url; as avatarUrl) {
          <img [src]="avatarUrl" alt="Avatar" class="h-full w-full object-cover" />
        } @else {
          <app-icon name="user" />
        }
      </span>
      <span class="hidden text-left sm:block">
        <span class="block text-sm font-semibold text-ink">{{ auth.user()?.name }}</span>
        <span class="block text-xs text-muted">{{ (auth.user()?.roles?.[0] ?? '') | titlecase }}</span>
      </span>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 20 20" fill="none" class="text-gray-400 transition-transform" [class.rotate-180]="dropdownOpen()">
        <path d="M4.79 7.4L10 12.6L15.21 7.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    @if (dropdownOpen()) {
      <div
        (click)="$event.stopPropagation()"
        class="absolute right-0 mt-2 w-64 rounded-xl border border-gray-200 bg-white p-3 shadow-lg"
        role="menu"
      >
        <div class="border-b border-gray-100 pb-3">
          <p class="text-sm font-semibold text-ink">{{ auth.user()?.name }}</p>
          <p class="text-xs text-muted">{{ auth.user()?.email }}</p>
        </div>
        <ul class="mt-2 flex flex-col gap-1">
          @if (!auth.isImpersonating()) {
            <li>
              <a
                routerLink="/panel/mi-perfil"
                (click)="closeDropdown()"
                class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm text-gray-700 transition hover:bg-gray-50"
                role="menuitem"
              >
                Mi perfil
              </a>
            </li>
          }
          <li>
            <button
              type="button"
              (click)="logout()"
              class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm text-error-600 transition hover:bg-error-50"
              role="menuitem"
            >
              Cerrar sesión
            </button>
          </li>
        </ul>
      </div>
    }
  </div>
</header>
