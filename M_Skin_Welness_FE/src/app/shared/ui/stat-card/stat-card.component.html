<div class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm md:p-6">
  <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-brand-50 text-brand-500 text-xl">
    <app-icon [name]="icon()" />
  </div>
  <div class="mt-5">
    <span class="text-sm text-muted">{{ title() }}</span>
    <h4 class="mt-2 text-2xl font-bold text-ink">{{ value() }}</h4>
    @if (subtitle(); as text) {
      <p
        class="mt-2 text-xs"
        [class.text-success-600]="trend() === 'up'"
        [class.text-error-600]="trend() === 'down'"
        [class.text-muted]="trend() === 'neutral'"
      >
        {{ text }}
      </p>
    }
  </div>
</div>
