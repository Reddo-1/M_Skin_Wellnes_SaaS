@if (label()) {
  <label [for]="inputId" class="mb-1.5 block text-sm font-medium text-gray-700">
    {{ label() }}@if (required()) {<span class="text-error-500"> *</span>}
  </label>
}
<input
  [id]="inputId"
  [type]="type()"
  [value]="value()"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [attr.min]="min()"
  [attr.max]="max()"
  [attr.step]="step()"
  [attr.autocomplete]="autocomplete()"
  (input)="handleInput($event)"
  (blur)="handleBlur()"
  class="h-11 w-full rounded-lg border bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-sm placeholder:text-gray-400 focus:border-brand-300 focus:outline-none focus:ring-2 focus:ring-brand-500/20 disabled:cursor-not-allowed disabled:bg-gray-50 disabled:opacity-60"
  [class.border-gray-300]="!invalid()"
  [class.border-error-500]="invalid()"
/>
@if (hint()) {
  <p class="mt-1.5 text-xs text-muted">{{ hint() }}</p>
}
