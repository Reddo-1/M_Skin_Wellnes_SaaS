<div class="relative w-full">
  <div
    (click)="toggleDropdown()"
    class="flex min-h-11 cursor-pointer rounded-lg border border-gray-300 bg-white py-1.5 pl-3 pr-3 shadow-sm transition focus-within:border-brand-500 focus-within:ring-4 focus-within:ring-brand-500/10"
    [class.opacity-60]="disabled()"
    [class.cursor-not-allowed]="disabled()"
  >
    <div class="flex flex-auto flex-wrap items-center gap-2">
      @if (selectedOptions().length > 0) {
        @for (option of selectedOptions(); track option.id) {
          <span class="group flex items-center gap-1 rounded-full bg-brand-50 px-2.5 py-1 text-xs font-medium text-brand-600 transition hover:bg-error-50 hover:text-error-500">
            <span class="max-w-[180px] truncate">{{ option.name }}</span>
            <button
              type="button"
              (click)="removeOption(option.id, $event)"
              class="flex h-4 w-4 items-center justify-center text-brand-500 transition group-hover:text-error-500"
              aria-label="Quitar"
            >
              <svg width="12" height="12" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M3.40717 4.46881C3.11428 4.17591 3.11428 3.70104 3.40717 3.40815C3.70006 3.11525 4.17494 3.11525 4.46783 3.40815L6.99943 5.93975L9.53095 3.40822C9.82385 3.11533 10.2987 3.11533 10.5916 3.40822C10.8845 3.70112 10.8845 4.17599 10.5916 4.46888L8.06009 7.00041L10.5916 9.53193C10.8845 9.82482 10.8845 10.2997 10.5916 10.5926C10.2987 10.8855 9.82385 10.8855 9.53095 10.5926L6.99943 8.06107L4.46783 10.5927C4.17494 10.8856 3.70006 10.8856 3.40717 10.5927C3.11428 10.2998 3.11428 9.8249 3.40717 9.53201L5.93877 7.00041L3.40717 4.46881Z"
                  fill="currentColor"
                />
              </svg>
            </button>
          </span>
        }
      } @else {
        <span class="self-center text-sm text-muted">{{ placeholder() }}</span>
      }
    </div>
    <div class="flex shrink-0 items-center pl-2">
      <svg
        width="20"
        height="20"
        viewBox="0 0 20 20"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        class="text-muted transition"
        [class.rotate-180]="isOpen()"
      >
        <path
          d="M4.79175 7.39551L10.0001 12.6038L15.2084 7.39551"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>
  </div>

  @if (isOpen()) {
    <div class="absolute left-0 right-0 top-full z-40 mt-1 max-h-60 overflow-y-auto rounded-lg border border-gray-200 bg-white shadow-lg">
      @if (options().length === 0) {
        <div class="px-3 py-3 text-sm text-muted">No hay opciones disponibles.</div>
      } @else {
        @for (option of options(); track option.id) {
          <button
            type="button"
            (click)="toggleOption(option.id, $event)"
            class="flex w-full items-center justify-between px-3 py-2 text-left text-sm transition"
            [class.bg-brand-50]="isSelected(option.id)"
            [class.text-brand-600]="isSelected(option.id)"
            [class.text-ink]="!isSelected(option.id)"
            [class.hover:bg-gray-50]="!isSelected(option.id)"
          >
            <span class="truncate">{{ option.name }}</span>
            @if (isSelected(option.id)) {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="ml-2 shrink-0">
                <path
                  d="M5 12l5 5L20 7"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            }
          </button>
        }
      }
    </div>
  }
</div>
