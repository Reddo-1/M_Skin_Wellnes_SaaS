<div class="relative w-full">
  <div
    (click)="toggleDropdown()"
    class="flex min-h-11 cursor-pointer items-center rounded-lg border bg-white py-1.5 pl-3 pr-3 shadow-sm transition focus-within:ring-4 focus-within:ring-brand-500/10"
    [class.border-gray-300]="!invalid()"
    [class.border-error-500]="invalid()"
    [class.focus-within:border-brand-500]="!invalid()"
    [class.opacity-60]="disabled()"
    [class.cursor-not-allowed]="disabled()"
  >
    <div class="flex flex-auto items-center overflow-hidden">
      @if (selectedLabel(); as label) {
        <span class="truncate text-sm text-ink">{{ label }}</span>
      } @else {
        <span class="truncate text-sm text-muted">{{ placeholder() }}</span>
      }
    </div>
    <div class="flex shrink-0 items-center pl-2">
      <svg
        width="20"
        height="20"
        viewBox="0 0 20 20"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        class="text-muted transition"
        [class.rotate-180]="isOpen()"
      >
        <path
          d="M4.79175 7.39551L10.0001 12.6038L15.2084 7.39551"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>
  </div>

  @if (isOpen()) {
    <div class="absolute left-0 right-0 top-full z-40 mt-1 rounded-lg border border-gray-200 bg-white shadow-lg">
      <div class="border-b border-gray-100 p-2">
        <input
          #searchBox
          type="text"
          [value]="query()"
          (input)="onQueryInput(searchBox.value)"
          [placeholder]="searchPlaceholder()"
          class="w-full rounded-md border border-gray-200 bg-white px-3 py-2 text-sm text-ink placeholder:text-muted focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/10"
        />
      </div>

      <div class="max-h-60 overflow-y-auto py-1">
        @if (loading()) {
          <div class="px-3 py-3 text-sm text-muted">Buscando…</div>
        } @else if (options().length === 0) {
          <div class="px-3 py-3 text-sm text-muted">No se han encontrado resultados.</div>
        } @else {
          @for (option of options(); track option.value) {
            <button
              type="button"
              (click)="pick(option, $event)"
              class="flex w-full items-center justify-between gap-2 px-3 py-2 text-left transition"
              [class.bg-brand-50]="isSelected(option.value)"
              [class.hover:bg-gray-50]="!isSelected(option.value)"
            >
              <span class="min-w-0">
                <span
                  class="block truncate text-sm"
                  [class.text-brand-600]="isSelected(option.value)"
                  [class.font-medium]="isSelected(option.value)"
                  [class.text-ink]="!isSelected(option.value)"
                  >{{ option.label }}</span
                >
                @if (option.sublabel) {
                  <span class="block truncate text-xs text-muted">{{ option.sublabel }}</span>
                }
              </span>
              @if (isSelected(option.value)) {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="shrink-0 text-brand-500">
                  <path
                    d="M5 12l5 5L20 7"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              }
            </button>
          }
        }
      </div>
    </div>
  }
</div>
