<button
  type="button"
  role="switch"
  [attr.aria-checked]="checked()"
  [disabled]="disabled()"
  (click)="toggle()"
  class="flex w-full items-start gap-3 text-left disabled:cursor-not-allowed disabled:opacity-60"
>
  <span
    class="relative mt-0.5 inline-block h-6 w-11 shrink-0 rounded-full transition-colors duration-150"
    [class.bg-brand-500]="checked()"
    [class.bg-gray-200]="!checked()"
  >
    <span
      class="absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow-sm transition-transform duration-150"
      [class.translate-x-5]="checked()"
    ></span>
  </span>
  @if (label() || description()) {
    <span class="text-sm">
      @if (label()) {
        <span class="font-medium text-gray-700">{{ label() }}</span>
      }
      @if (description()) {
        <span class="block text-xs text-muted">{{ description() }}</span>
      }
    </span>
  }
</button>
