@if (label()) {
  <label [for]="fieldId" class="mb-1.5 flex items-center gap-1.5 text-sm font-medium text-gray-700">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="size-4 text-gray-400">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M12 3.75C7.44 3.75 3.75 7.44 3.75 12C3.75 16.56 7.44 20.25 12 20.25C16.56 20.25 20.25 16.56 20.25 12C20.25 7.44 16.56 3.75 12 3.75ZM2.25 12C2.25 6.61 6.61 2.25 12 2.25C17.39 2.25 21.75 6.61 21.75 12C21.75 17.39 17.39 21.75 12 21.75C6.61 21.75 2.25 17.39 2.25 12ZM12 6.25C12.41 6.25 12.75 6.59 12.75 7V11.69L15.53 14.47C15.82 14.76 15.82 15.24 15.53 15.53C15.24 15.82 14.76 15.82 14.47 15.53L11.47 12.53C11.33 12.39 11.25 12.2 11.25 12V7C11.25 6.59 11.59 6.25 12 6.25Z" fill="currentColor" />
    </svg>
    {{ label() }}@if (required()) {<span class="text-error-500"> *</span>}
  </label>
}
<div [id]="fieldId" class="flex items-center gap-2">
  <div class="flex-1">
    <app-select
      [options]="hourOptions"
      [selected]="hour()"
      [disabled]="disabled()"
      [invalid]="invalid()"
      placeholder="HH"
      (selectionChange)="setHour($event)"
    />
  </div>
  <span class="text-lg font-semibold text-muted">:</span>
  <div class="flex-1">
    <app-select
      [options]="minuteOptions()"
      [selected]="minute()"
      [disabled]="disabled()"
      [invalid]="invalid()"
      placeholder="mm"
      (selectionChange)="setMinute($event)"
    />
  </div>
</div>
