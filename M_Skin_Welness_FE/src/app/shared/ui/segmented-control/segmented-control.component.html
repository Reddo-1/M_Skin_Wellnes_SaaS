<div class="inline-flex rounded-lg border border-gray-200 bg-gray-50 p-1 text-sm">
  @for (option of options(); track option.value) {
    <button
      type="button"
      (click)="onSelect(option.value)"
      class="rounded-md px-4 py-1.5 font-medium transition"
      [class.bg-white]="selected() === option.value"
      [class.text-ink]="selected() === option.value"
      [class.shadow-sm]="selected() === option.value"
      [class.text-muted]="selected() !== option.value"
      [class.hover:text-ink]="selected() !== option.value"
    >
      {{ option.label }}
    </button>
  }
</div>
