<div class="min-h-screen bg-gray-50 p-8">
  <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
    <div class="flex items-start justify-between">
      <div>
        <h1 class="text-2xl font-semibold text-gray-900">Panel</h1>
        <p class="mt-1 text-sm text-gray-500">
          Estás dentro. Próximo bloque: layout de TailAdmin + redirección por rol.
        </p>
      </div>
      <button
        (click)="logout()"
        class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-50"
      >
        Cerrar sesión
      </button>
    </div>

    <dl class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div class="rounded-lg bg-gray-50 px-4 py-3">
        <dt class="text-xs font-medium uppercase tracking-wide text-gray-500">Usuario</dt>
        <dd class="mt-1 text-sm text-gray-900">{{ user()?.name }}</dd>
      </div>
      <div class="rounded-lg bg-gray-50 px-4 py-3">
        <dt class="text-xs font-medium uppercase tracking-wide text-gray-500">Email</dt>
        <dd class="mt-1 text-sm text-gray-900">{{ user()?.email }}</dd>
      </div>
      <div class="rounded-lg bg-gray-50 px-4 py-3">
        <dt class="text-xs font-medium uppercase tracking-wide text-gray-500">Roles</dt>
        <dd class="mt-1 text-sm text-gray-900">{{ roles().join(', ') || '—' }}</dd>
      </div>
      <div class="rounded-lg bg-gray-50 px-4 py-3">
        <dt class="text-xs font-medium uppercase tracking-wide text-gray-500">ID de centro</dt>
        <dd class="mt-1 text-sm text-gray-900">{{ centerId() ?? '—' }}</dd>
      </div>
    </dl>
  </div>
</div>
